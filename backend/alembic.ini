# Alembic 配置。数据库地址不写在这里：由 migrations/env.py 从环境变量 DATABASE_URL 读取，
# 避免把口令提交进版本库。

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
path_separator = os
# 迁移文件名带时间戳，按生成顺序排列
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
